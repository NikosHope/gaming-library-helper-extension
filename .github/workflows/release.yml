name: Firefox prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan history and workflow policy
        run: |
          bash scripts/install-ci-tools.sh
          "$RUNNER_TEMP/glh-tools/gitleaks" git --redact --no-banner .
          "$RUNNER_TEMP/glh-tools/actionlint" -shellcheck=
          node scripts/check-workflows.mjs
      - run: pnpm verify
      - run: pnpm check:audit --strict
      - run: pnpm zip:firefox
      - run: pnpm lint:addon && pnpm check:manifest && pnpm check:package
      - name: Verify version and reviewed source commit
        run: node scripts/check-release.mjs
      - name: Reproduce reviewer sources
        run: |
          source_dir="$RUNNER_TEMP/release-reviewer-source"
          mkdir -p "$source_dir"
          unzip -q .output/*-sources.zip -d "$source_dir"
          cd "$source_dir"
          git init
          git add .
          pnpm install --frozen-lockfile
          pnpm verify
      - name: Portable checksums
        working-directory: .output
        run: sha256sum *.zip BUILD_INFO.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-prerelease
          include-hidden-files: true
          path: |
            .output/*.zip
            .output/SHA256SUMS
            .output/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish unsigned GitHub prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firefox-prerelease
          path: release-assets
      - name: Verify downloaded bytes
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS
      - name: Publish verified packages
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --target "$GITHUB_SHA" \
            --title "Gaming Library Helper $RELEASE_TAG" --prerelease \
            --notes-file "docs/releases/$RELEASE_TAG.md"
