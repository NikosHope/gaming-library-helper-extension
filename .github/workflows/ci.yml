name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 24
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: error

  package:
    name: Firefox package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm zip:firefox
      - run: pnpm lint:addon && pnpm check:manifest && pnpm check:package
      - name: Reproduce all checks from the reviewer source ZIP
        run: |
          source_dir="$RUNNER_TEMP/reviewer-source"
          mkdir -p "$source_dir"
          unzip -q .output/*-sources.zip -d "$source_dir"
          cd "$source_dir"
          git init
          git add .
          pnpm install --frozen-lockfile
          pnpm verify
      - name: Checksums
        working-directory: .output
        run: sha256sum *.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-unsigned-and-reviewer-source
          # Only the already inspected ZIPs and checksums are uploaded from hidden .output.
          include-hidden-files: true
          path: |
            .output/*.zip
            .output/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
