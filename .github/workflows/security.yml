name: Security

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  schedule:
    - cron: '19 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets and workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned security tools
        run: bash scripts/install-ci-tools.sh
      - name: Scan full Git history with redacted output
        run: '"$RUNNER_TEMP/glh-tools/gitleaks" git --redact --no-banner .'
      - name: Validate GitHub Actions syntax and expressions
        run: '"$RUNNER_TEMP/glh-tools/actionlint" -shellcheck='
      - name: Reject mutable action references or privileged PR triggers
        run: node scripts/check-workflows.mjs

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:audit
